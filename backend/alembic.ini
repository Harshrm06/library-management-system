# Alembic configuration for the Library Management System backend.
#
# The database URL is intentionally left empty here: alembic/env.py reads it
# from DATABASE_URL (backend/.env, see config.py) and overrides this value, so
# credentials never have to live in version control.
#
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic history --verbose
#   alembic current

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S